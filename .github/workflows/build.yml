name: Build APK
permissions:
  contents: write
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build debug APK
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^e: |What went wrong|Execution failed|Could not |error:" -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::${l:0:800}"; done
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: pori-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Pori-debug.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest Pori-debug.apk --title "Pori (latest build)" --notes "Debug APK built from the latest commit on main." --target "${{ github.sha }}"
